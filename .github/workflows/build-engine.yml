name: Build Stellarium Web Engine

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-engine.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:1.39.17
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Diagnostics
        run: |
          set +e
          mkdir -p /ci
          {
            echo "=== run ${{ github.run_number }} ==="
            echo "--- os ---"
            head -n 2 /etc/os-release
            echo "--- emsdk ---"
            source /emsdk/emsdk_env.sh
            echo "PATH=$PATH"
            which emcc && emcc --version | head -n 2
            which emscons
            which scons || echo "scons: not present yet (expected)"
            echo "--- python ---"
            python3 --version
            python3 -m pip --version
          } 2>&1 | tee -a /ci/ci.log
          exit 0

      - name: Install scons via pip
        run: |
          set -o pipefail
          python3 -m pip install --no-cache-dir --disable-pip-version-check "scons==4.5.2" 2>&1 | tee -a /ci/ci.log
          which scons
          scons --version 2>&1 | tee -a /ci/ci.log

      - name: Clone engine with submodules
        run: |
          set -o pipefail
          git clone --recurse-submodules https://github.com/Stellarium/stellarium-web-engine.git /swe 2>&1 | tee -a /ci/ci.log
          git -C /swe rev-parse HEAD | tee -a /ci/ci.log

      - name: Build engine
        id: build
        run: |
          set -o pipefail
          cd /swe
          source /emsdk/emsdk_env.sh
          emscons scons -j8 mode=release werror=0 2>&1 | tee -a /ci/ci.log
          echo "--- build dir ---" | tee -a /ci/ci.log
          ls -la /swe/build 2>&1 | tee -a /ci/ci.log

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p /out
          cp /swe/build/stellarium-web-engine.js /out/
          cp /swe/build/stellarium-web-engine.wasm /out/
          cp /swe/build/stellarium-web-engine.data /out/ 2>/dev/null || true
          ls -la /out | tee -a /ci/ci.log

      - name: Publish release assets
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engine-run-${{ github.run_number }}
          name: Stellarium Web Engine build ${{ github.run_number }}
          body: |
            Automated build of Stellarium Web Engine from source.
            Upstream: https://github.com/Stellarium/stellarium-web-engine
          files: |
            /out/stellarium-web-engine.js
            /out/stellarium-web-engine.wasm

      - name: Save CI log on failure
        if: failure()
        run: |
          set +e
          cd /tmp
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /site 2>&1 | tail -n 5
          cd /site || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -s /ci/ci.log ]; then
            tail -n 2000 /ci/ci.log > build-log.txt
            git add build-log.txt
            git commit -m "chore: capture build log from failed run ${{ github.run_number }}"
            git push || true
          fi
